name: Build and Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: schedule-manager-windows-installer
            asset-path: dist/ScheduleManager-Setup-*.exe
          - name: macOS
            os: macos-latest
            artifact: schedule-manager-macos-app
            asset-path: dist/ScheduleManager-macOS-*.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Test
        run: cargo test --locked --all-targets

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup strawberryperl --yes --no-progress
          $version = "${{ github.ref_name }}".TrimStart("v")
          .\scripts\package.ps1 -Installer -Version $version

      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          APP_VERSION="$version" bash scripts/package-macos.sh
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Schedule Manager.app" \
            "dist/ScheduleManager-macOS-$version.zip"

      - name: Upload installer package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 3
          path: ${{ matrix.asset-path }}

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download installer packages
        uses: actions/download-artifact@v7
        with:
          pattern: schedule-manager-*
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" release-assets/* \
              --verify-tag \
              --title "Schedule Manager $TAG_NAME" \
              --notes "Windows 与 macOS 自动构建版本。"
          fi

  cleanup:
    name: Keep recent build history
    runs-on: ubuntu-latest
    needs: build
    if: always()
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete older build workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_FILE: release.yml
          KEEP_RUNS: "3"
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          run_ids=$(gh api "/repos/$REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs?per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .[].id')
          index=0
          for run_id in $run_ids; do
            index=$((index + 1))
            if [ "$index" -le "$KEEP_RUNS" ] || [ "$run_id" = "$CURRENT_RUN_ID" ]; then
              continue
            fi
            gh api --method DELETE "/repos/$REPOSITORY/actions/runs/$run_id"
          done
